management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    metrics:
      enabled: true
    sessions:
      enabled: false
    jmx:
      enabled: false
  health:
    redis:
      enabled: false
    db:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s
  prometheus:
    metrics:
      export:
        enabled: true
server:
  port: 8689
  # Tomcat 优化配置
  tomcat:
    # 线程池配置
    threads:
      max: 200                    # 最大线程数
      min-spare: 10              # 最小空闲线程数
    # 连接器配置
    max-connections: 8192        # 最大连接数
    accept-count: 100            # 等待队列长度
    max-http-header-size: 8KB    # 最大HTTP头大小
    max-http-form-post-size: 2MB # 最大POST大小
    max-http-header-count: 200   # 最大HTTP头数量
    # 连接超时配置
    connection-timeout: 20000    # 连接超时 20秒
    keep-alive-timeout: 15000    # Keep-Alive超时 15秒
    max-keep-alive-requests: 100 # 最大Keep-Alive请求数
    # 压缩配置
    compression:
      enabled: true
      mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
      min-response-size: 1024
    # 启用HTTP/2
    http2:
      enabled: true
  # 服务端配置
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        max-age: 1800
        http-only: true
        secure: false
        same-site: lax
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: signature-service
  main:
    web-application-type: reactive
    banner-mode: off
    lazy-initialization: false
    allow-circular-references: true
    allow-bean-definition-overriding: true
  jmx:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.session.SessionsEndpointAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.endpoint.jmx.JmxEndpointAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.session.ReactiveSessionsEndpoint

  # Jackson 优化
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      write-null-map-values: false
      write-empty-json-arrays: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
      fail-on-null-for-primitives: false
    mapper:
      default-view-inclusion: false
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 缓存配置
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=300s,expireAfterAccess=60s,refreshAfterWrite=60s
    cache-names:
      - user-cache
      - config-cache
      - session-cache
      - api-cache
      - static-cache
  # 任务调度优化
  task:
    execution:
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: async-task-
    scheduling:
      pool:
        size: 8
      thread-name-prefix: scheduled-task-
  # 消息转换器优化
  # 静态资源优化
  web:
    resources:
      cache:
        period: 31536000  # 1年
        cachecontrol:
          max-age: 31536000
          public: true
      chain:
        strategy:
          fixed:
            enabled: true
            version: "1.0"
          content:
            enabled: true
        cache: true
        html-application-cache: true
  # 数据库连接池优化
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # 连接池基本配置
      minimum-idle: 5                    # 最小空闲连接数
      maximum-pool-size: 20              # 最大连接池大小
      idle-timeout: 300000               # 空闲连接超时时间 (5分钟)
      max-lifetime: 1200000              # 连接最大生存时间 (20分钟)
      connection-timeout: 20000          # 连接超时时间 (20秒)
      validation-timeout: 3000           # 验证超时时间 (3秒)
      # 性能优化配置
      leak-detection-threshold: 60000    # 连接泄漏检测阈值 (1分钟)
      connection-test-query: SELECT 1    # 连接测试查询
      auto-commit: true                  # 自动提交
      read-only: false                   # 只读模式
      # 连接池名称
      pool-name: HikariCP-Pool
      # 数据源属性
      data-source-properties:
        # MySQL 优化
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
        useLocalTransactionState: true
        # 连接优化
        socketTimeout: 30000
        connectTimeout: 10000
        autoReconnect: true
        failOverReadOnly: false
        maxReconnects: 3
        initialTimeout: 2
        # 字符集优化
        characterEncoding: utf8mb4
        useUnicode: true
        # 其他优化
        useSSL: false
        allowPublicKeyRetrieval: true
        serverTimezone: GMT%2B8
        zeroDateTimeBehavior: convertToNull
        nullCatalogMeansCurrent: true
        nullNamePatternMatchesAll: true
        useInformationSchema: true
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false

  # 数据库配置


  # Redis配置
  data:
    redis:
      host: 8.133.246.113
      port: 6379
      password: 5z25u2sk
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # Elasticsearch配置
  elasticsearch:
    uris: http://8.133.246.113:9200
    connection-timeout: 30s
    socket-timeout: 30s
    username: elastic
    password: elastic123
    # 禁用SSL验证（如果需要）
    ssl:
      verification-mode: none

  # 禁用Nacos配置
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/*.xml

# Feign配置
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000
        logger-level: full

# 签名验证配置
signature:
  enabled: true
  timestamp-expire-seconds: 300
  nonce-cache-expire-seconds: 1800
  app-secret-cache-expire-seconds: 3600
  # 签名验证过滤器配置
  verification:
    enabled: false  # 禁用签名验证过滤器，允许直接访问签名生成接口
    timestamp-expire-seconds: 300
    nonce-cache-expire-seconds: 1800
    excluded-paths:
      - "/actuator/**"
      - "/health/**"
      - "/api/auth/**"
      - "/api/public/**"
      - "/api/signature/**"
      - "/api/token/**"
      - "/api/keys/**"
      - "/api/validation/**"
  # 异步验证配置
  async:
    enabled: true
    mode: HYBRID
    timeout: 5000
  # 批量验证配置
  batch:
    enabled: false
    max-batch-size: 100
    timeout: 10000
  # API Key验证配置
  api-key:
    enabled: false  # 禁用API Key验证，允许直接访问
    header-name: X-API-Key
    test-key: test-api-key-123
    strict-validation: false


# 日志配置
logging:
  level:
    org.apache.dubbo: WARN  # 将Dubbo日志级别改为WARN，减少INFO级别的关闭信息
    org.apache.dubbo.config.DubboShutdownHook: ERROR  # 将关闭钩子日志级别改为ERROR，只显示真正的错误
    com.jiangyang.dubbo: DEBUG
    com.bgpay.signature: DEBUG
    com.alibaba.nacos: OFF  # 禁用Nacos日志
    io.seata: OFF  # 禁用Seata日志
    com.netflix.eureka: OFF
    root: INFO
    org.springframework: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.apache.tomcat: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.juli: WARN
    com.zaxxer.hikari: WARN
    com.alibaba.druid: WARN
    com.jiangyang: DEBUG
    com.signature: DEBUG  # 禁用Eureka日志
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log

# 禁用Seata分布式事务
seata:
  enabled: false
  saga:
    enabled: false
    state-machine:
      auto-register: false
      enabled: false
saga:
  enabled: false

# 禁用Eureka客户端
eureka:
  client:
    enabled: false
  instance:
    enabled: false

# OpenAPI / Swagger 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
    enabled: true

# Dubbo 启用开关（当需要完全禁用Dubbo时，设置为false）
dubbo:
  enabled: true  # 可以设置为false来完全禁用Dubbo

  # Dubbo 配置
  application:
    name: signature-service
    version: 1.0.0
    owner: jiangyang
    organization: jiangyang-tech
    # 优化关闭行为
    shutdown:
      timeout: 10000
      wait: 5000
      force: true

  # 注册中心配置
  registry:
    address: nacos://localhost:8848
    namespace: dubbo
    group: DEFAULT_GROUP
    timeout: 10000
    check: false  # 启动时不检查注册中心

  # 协议配置
  protocol:
    name: dubbo
    port: 20881
    host: localhost
    threads: 200
    iothreads: 4
    accepts: 1000
    payload: 8388608  # 8MB

  # 提供者配置
  provider:
    timeout: 5000
    retries: 0
    loadbalance: roundrobin
    cluster: failfast
    serialization: fastjson2  # 使用 fastjson2 序列化，Java 17 兼容性更好

  # 禁用配置中心和元数据中心（避免强制连接Nacos）
  config-center:
    address: ""  # 禁用配置中心

  metadata-report:
    address: ""  # 禁用元数据中心

  # 监控配置 - 禁用监控功能
  monitor:
    protocol: registry
    enabled: false

  # 优化关闭钩子配置
  shutdown:
    timeout: 10000
    wait: 5000

# 日志配置

# 性能监控配置
micrometer:
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s

# 应用特定优化
application:
  performance:
    # 启用性能优化
    enabled: true
    # 响应时间目标
    target-response-time: 10ms
    # 缓存配置
    cache:
      enabled: true
      ttl: 300s
      max-size: 10000
    # 异步处理
    async:
      enabled: true
      core-pool-size: 8
      max-pool-size: 16
      queue-capacity: 100
    # 连接池优化
    connection-pool:
      max-active: 20
      min-idle: 5
      max-wait: 1000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
    force: true


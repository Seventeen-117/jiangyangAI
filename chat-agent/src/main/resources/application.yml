# Chat Agent Service 主配置文件
server:
  port: 8082
  # Tomcat 优化配置
  tomcat:
    # 线程池配置
    threads:
      max: 200                    # 最大线程数
      min-spare: 10              # 最小空闲线程数
    # 连接器配置
    max-connections: 8192        # 最大连接数
    accept-count: 100            # 等待队列长度
    max-http-header-size: 8KB    # 最大HTTP头大小
    max-http-form-post-size: 2MB # 最大POST大小
    max-http-header-count: 200   # 最大HTTP头数量
    # 连接超时配置
    connection-timeout: 20000    # 连接超时 20秒
    keep-alive-timeout: 15000    # Keep-Alive超时 15秒
    max-keep-alive-requests: 100 # 最大Keep-Alive请求数
    # 压缩配置
    compression:
      enabled: true
      mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
      min-response-size: 1024
    # 启用HTTP/2
    http2:
      enabled: true
  # 服务端配置
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        max-age: 1800
        http-only: true
        secure: false
        same-site: lax

spring:
  application:
    name: chat-agent-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: reactive
    banner-mode: off
    lazy-initialization: false
    allow-circular-references: true
    allow-bean-definition-overriding: true
    # 启用启动信息
    log-startup-info: true
  # Jackson 优化
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      write-null-map-values: false
      write-empty-json-arrays: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
      fail-on-null-for-primitives: false
    mapper:
      default-view-inclusion: false
    time-zone: GMT+8
  # 缓存配置
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=300s,expireAfterAccess=60s,refreshAfterWrite=60s
    cache-names:
      - user-cache
      - config-cache
      - session-cache
      - api-cache
      - static-cache
  # 任务调度优化
  task:
    execution:
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: async-task-
    scheduling:
      pool:
        size: 8
      thread-name-prefix: scheduled-task-
  # 消息转换器优化
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # 静态资源优化
  web:
    resources:
      cache:
        period: 31536000  # 1年
        cachecontrol:
          max-age: 31536000
          public: true
      chain:
        strategy:
          fixed:
            enabled: true
            version: "1.0"
          content:
            enabled: true
        cache: true
        html-application-cache: true
  # 数据库连接池优化
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # 连接池基本配置
      minimum-idle: 5                    # 最小空闲连接数
      maximum-pool-size: 20              # 最大连接池大小
      idle-timeout: 300000               # 空闲连接超时时间 (5分钟)
      max-lifetime: 1200000              # 连接最大生存时间 (20分钟)
      connection-timeout: 20000          # 连接超时时间 (20秒)
      validation-timeout: 3000           # 验证超时时间 (3秒)
      # 性能优化配置
      leak-detection-threshold: 60000    # 连接泄漏检测阈值 (1分钟)
      connection-test-query: SELECT 1    # 连接测试查询
      auto-commit: true                  # 自动提交
      read-only: false                   # 只读模式
      # 连接池名称
      pool-name: HikariCP-Pool
      # 数据源属性
      data-source-properties:
        # MySQL 优化
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
        useLocalTransactionState: true
        # 连接优化
        socketTimeout: 30000
        connectTimeout: 10000
        autoReconnect: true
        failOverReadOnly: false
        maxReconnects: 3
        initialTimeout: 2
        # 字符集优化
        characterEncoding: utf8mb4
        useUnicode: true
        # 其他优化
        useSSL: false
        allowPublicKeyRetrieval: true
        serverTimezone: GMT%2B8
        zeroDateTimeBehavior: convertToNull
        nullCatalogMeansCurrent: true
        nullNamePatternMatchesAll: true
        useInformationSchema: true
    dynamic:
      enabled: true  # 启用动态数据源
      seata: false  # 禁用Seata分布式事务
      primary: master  # 设置主数据源
  ai:
    tool:
      calling:
        enabled: false  # 禁用Spring AI工具调用功能
    # OpenAI配置
    openai:
      enabled: false
      api-key: ${OPENAI_API_KEY:sk-demo-key-for-development-only}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: gpt-3.5-turbo
          temperature: 0.7
          max-tokens: 1000
    # Azure OpenAI配置
    azure:
      openai:
        enabled: false
        api-key: ${AZURE_OPENAI_API_KEY:demo-key-for-development-only}
        endpoint: ${AZURE_OPENAI_ENDPOINT:https://demo.openai.azure.com}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-35-turbo}
            temperature: 0.7
            max-tokens: 1000
    # Ollama配置
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama2}
          temperature: 0.7
  # 禁用Redis自动配置
  redis:
    enabled: false
  # 禁用Elasticsearch自动配置
  elasticsearch:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.reactive.ReactiveOAuth2ClientAutoConfiguration
      - org.springframework.ai.autoconfigure.vectorstore.redis.RedisVectorStoreAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAutoConfiguration
      - org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiAutoConfiguration
      - org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiAudioTranscriptionAutoConfiguration

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    metrics:
      enabled: true
  health:
    redis:
      enabled: false
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s

# 性能监控配置
micrometer:
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s

# 应用特定优化
application:
  performance:
    # 启用性能优化
    enabled: true
    # 响应时间目标
    target-response-time: 10ms
    # 缓存配置
    cache:
      enabled: true
      ttl: 300s
      max-size: 10000
    # 异步处理
    async:
      enabled: true
      core-pool-size: 8
      max-pool-size: 16
      queue-capacity: 100
    # 连接池优化
    connection-pool:
      max-active: 20
      min-idle: 5
      max-wait: 1000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

# 服务配置
service:
  name: chat-agent-service
  version: 1.0.0

# Seata配置 - 禁用分布式事务但提供必要的配置避免验证错误
seata:
  enabled: false
  auto-data-source-proxy: false
  enable-auto-data-source-proxy: false
  disable-global-transaction: true
  application-id: ${spring.application.name}
  tx-service-group: chat-agent-service-group
  # 注册中心配置 - 提供基本配置避免验证错误
  registry:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP
      namespace: ""
      username: ""
      password: ""
  # 配置中心配置 - 提供基本配置避免验证错误
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP
      namespace: ""
      username: ""
      password: ""
  # 存储配置 - 提供基本配置避免验证错误
  store:
    mode: file
    file:
      dir: file_store/data
  service:
    vgroup-mapping:
      chat-agent-service-group: default
    grouplist:
      default: 8.133.246.113:8091
    enable-degrade: false
    disable-global-transaction: true
  client:
    rm:
      report-success-enable: false
      table-meta-check-enable: false
      report-retry-count: 0
      async-commit-buffer-limit: 0
    tm:
      commit-retry-count: 0
      rollback-retry-count: 0
      default-global-transaction-timeout: 0
      degrade-check: false
      degrade-check-allow-times: 0
      degrade-check-period: 0

# 管理端点配置 - 禁用不必要的功能
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    info:
      enabled: true
  # 禁用指标收集
  metrics:
    enable:
      all: false
  # 使用新的配置属性
  simple:
    metrics:
      export:
        enabled: false
  # 禁用健康检查详情
  health:
    defaults:
      enabled: false
    redis:
      enabled: false
    db:
      enabled: false
    diskspace:
      enabled: false
    elasticsearch:
      enabled: false
    datasource:
      enabled: false
    cache:
      enabled: false

# 日志配置
logging:
  level:
    # 设置根日志级别
    root: INFO
    io.seata: OFF
    com.jiangyang.base.config: DEBUG
    com.jiangyang.base.seata.util.SeataConfigValidator: WARN  # 降低Seata配置验证器的日志级别
    org.springframework.ai: DEBUG
    org.springframework.ai.model.tool: OFF  # 禁用工具调用相关日志


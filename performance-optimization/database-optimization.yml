# 数据库性能优化配置
# 目标：将响应时间优化到10毫秒以内

# 1. HikariCP 连接池优化 (推荐)
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # 连接池基本配置
      minimum-idle: 5                    # 最小空闲连接数
      maximum-pool-size: 20              # 最大连接池大小
      idle-timeout: 300000               # 空闲连接超时时间 (5分钟)
      max-lifetime: 1200000              # 连接最大生存时间 (20分钟)
      connection-timeout: 20000          # 连接超时时间 (20秒)
      validation-timeout: 3000           # 验证超时时间 (3秒)
      
      # 性能优化配置
      leak-detection-threshold: 60000    # 连接泄漏检测阈值 (1分钟)
      connection-test-query: SELECT 1    # 连接测试查询
      auto-commit: true                  # 自动提交
      read-only: false                   # 只读模式
      
      # 连接池名称
      pool-name: HikariCP-Pool
      
      # 数据源属性
      data-source-properties:
        # MySQL 优化
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
        # 连接优化
        socketTimeout: 30000
        connectTimeout: 10000
        autoReconnect: true
        failOverReadOnly: false
        maxReconnects: 3
        initialTimeout: 2
        
        # 字符集优化
        characterEncoding: utf8mb4
        useUnicode: true
        
        # 其他优化
        useSSL: false
        allowPublicKeyRetrieval: true
        serverTimezone: GMT%2B8
        zeroDateTimeBehavior: convertToNull
        nullCatalogMeansCurrent: true
        nullNamePatternMatchesAll: true
        useInformationSchema: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 基本配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 1000
      
      # 性能优化
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      
      # 连接池监控
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      
      # 过滤器配置
      filters: stat,wall,slf4j
      
      # 连接属性
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      
      # 监控配置
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: admin
        allow: 127.0.0.1

# 3. JPA/Hibernate 优化
spring:
  jpa:
    # 数据库方言
    database-platform: org.hibernate.dialect.MySQL8Dialect
    
    # 性能优化
    properties:
      hibernate:
        # 连接池配置
        connection:
          provider_disables_autocommit: true
        
        # 缓存配置
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        
        # 批量操作优化
        jdbc:
          batch_size: 20
          batch_versioned_data: true
          order_inserts: true
          order_updates: true
        
        # 查询优化
        query:
          in_clause_parameter_padding: true
          plan_cache_max_size: 2048
          plan_parameter_metadata_max_size: 128
        
        # 其他优化
        generate_statistics: false
        jdbc:
          lob:
            non_contextual_creation: true
        temp:
          use_jdbc_metadata_defaults: false
        id:
          new_generator_mappings: true
        hbm2ddl:
          auto: none
        show_sql: false
        format_sql: false
        
        # 连接提供者
        connection:
          provider_class: org.hibernate.hikaricp.internal.HikariCPConnectionProvider

# 4. MyBatis 优化
mybatis:
  configuration:
    # 缓存配置
    cache-enabled: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
    multiple-result-sets-enabled: true
    use-column-label: true
    use-generated-keys: true
    auto-mapping-behavior: partial
    auto-mapping-unknown-column-behavior: none
    default-executor-type: reuse
    default-statement-timeout: 25
    default-fetch-size: 100
    safe-row-bounds-enabled: false
    safe-result-handler-enabled: true
    local-cache-scope: session
    jdbc-type-for-null: other
    lazy-load-trigger-methods: equals,clone,hashCode,toString
    default-scripting-language: org.apache.ibatis.scripting.xmltags.XMLLanguageDriver
    call-setters-on-nulls: false
    return-instance-for-empty-row: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 5. 数据库连接优化
database:
  optimization:
    # 连接池监控
    monitoring:
      enabled: true
      log-slow-queries: true
      slow-query-threshold: 1000  # 1秒
    
    # 查询优化
    query:
      # 启用查询缓存
      cache-enabled: true
      # 查询超时
      timeout: 5000
      # 批量大小
      batch-size: 100
      # 分页大小
      page-size: 20
    
    # 连接优化
    connection:
      # 连接验证
      validation-query: SELECT 1
      validation-interval: 30000
      # 连接泄漏检测
      leak-detection-threshold: 60000
      # 连接回收
      eviction-interval: 60000
      # 连接测试
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

# 6. 数据库特定优化
mysql:
  optimization:
    # 连接优化
    connection:
      auto-reconnect: true
      fail-over-read-only: false
      max-reconnects: 3
      initial-timeout: 2
    
    # 查询优化
    query:
      # 启用查询缓存
      query-cache-type: 1
      query-cache-size: 64M
      # 启用查询缓存
      query-cache-limit: 2M
    
    # 其他优化
    other:
      # 字符集
      character-set-server: utf8mb4
      collation-server: utf8mb4_unicode_ci
      # 时区
      default-time-zone: '+8:00'
      # 其他
      sql-mode: STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
      max-connections: 1000
      max-connect-errors: 1000
      table-open-cache: 2000
      thread-cache-size: 16
      query-cache-size: 64M
      tmp-table-size: 64M
      max-heap-table-size: 64M

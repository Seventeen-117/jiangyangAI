# Nacos配置示例：metersphere-properties-dev.yaml
# 这个文件替代原来的 file:/opt/metersphere/conf/metersphere.properties

# 系统配置
metersphere:
  system:
    # 文件上传配置
    upload:
      max-size: 1024MB
      allowed-types: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,zip,rar
    
    # 临时文件配置
    temp:
      cleanup-interval: 3600
      max-age: 86400
    
    # 日志配置
    log:
      level: DEBUG
      retention: 30
    
    # 缓存配置
    cache:
      ttl: 3600
      max-size: 1000
    
    # 安全配置
    security:
      session-timeout: 43200
      max-login-attempts: 5
      lockout-duration: 300

# 数据库配置
database:
  # 连接池配置
  pool:
    initial-size: 5
    max-active: 100
    min-idle: 5
    max-wait: 60000
  
  # 性能配置
  performance:
    slow-query-threshold: 5000
    enable-slow-query-log: true

# Redis配置
redis:
  # 连接池配置
  pool:
    max-active: 20
    max-idle: 10
    min-idle: 5
    max-wait: 3000
  
  # 序列化配置
  serialization:
    key-prefix: "ms:"
    default-ttl: 3600

# MinIO配置
minio:
  # 存储配置
  storage:
    default-bucket: metersphere
    temp-bucket: metersphere-temp
    backup-bucket: metersphere-backup
  
  # 文件配置
  file:
    max-size: 1024MB
    allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,zip,rar

# Kafka配置
kafka:
  # 消费者配置
  consumer:
    max-poll-records: 500
    max-poll-interval: 300000
    session-timeout: 30000
  
  # 生产者配置
  producer:
    batch-size: 16384
    linger-ms: 1
    buffer-memory: 33554432

# JMeter配置
jmeter:
  # 执行配置
  execution:
    max-concurrent-users: 1000
    max-duration: 3600
    default-ramp-up: 60
  
  # 报告配置
  report:
    enable-html: true
    enable-csv: true
    enable-jtl: true
  
  # 资源配置
  resources:
    max-heap-size: 4g
    max-threads: 200

# 监控配置
monitoring:
  # 性能监控
  performance:
    enable-metrics: true
    enable-tracing: true
    sample-rate: 0.1
  
  # 健康检查
  health:
    check-interval: 30
    timeout: 10
    retry-count: 3

# 通知配置
notification:
  # 邮件配置
  email:
    enabled: true
    smtp-host: smtp.example.com
    smtp-port: 587
    smtp-username: ${EMAIL_USERNAME}
    smtp-password: ${EMAIL_PASSWORD}
  
  # 钉钉配置
  dingtalk:
    enabled: false
    webhook-url: ${DINGTALK_WEBHOOK_URL}
    secret: ${DINGTALK_SECRET}
  
  # 企业微信配置
  wechat:
    enabled: false
    corp-id: ${WECHAT_CORP_ID}
    agent-id: ${WECHAT_AGENT_ID}
    secret: ${WECHAT_SECRET}

# 插件配置
plugins:
  # 插件管理
  management:
    auto-update: true
    update-check-interval: 86400
  
  # 插件安全
  security:
    signature-verification: true
    allow-unsigned: false

# 国际化配置
i18n:
  # 默认语言
  default-locale: zh_CN
  
  # 支持的语言
  supported-locales:
    - zh_CN
    - en_US
  
  # 消息缓存
  message-cache:
    enabled: true
    ttl: 3600

# 定时任务配置
scheduler:
  # 任务执行
  execution:
    max-concurrent-jobs: 10
    misfire-threshold: 60000
  
  # 任务存储
  storage:
    type: database
    table-prefix: ms_scheduler_

# 文件存储配置
storage:
  # 本地存储
  local:
    enabled: true
    base-path: /opt/metersphere/storage
  
  # 云存储
  cloud:
    enabled: false
    provider: aliyun
    endpoint: ${CLOUD_STORAGE_ENDPOINT}
    access-key: ${CLOUD_STORAGE_ACCESS_KEY}
    secret-key: ${CLOUD_STORAGE_SECRET_KEY}
    bucket: ${CLOUD_STORAGE_BUCKET}

# 备份配置
backup:
  # 自动备份
  auto:
    enabled: true
    schedule: "0 2 * * *"
    retention: 7
  
  # 备份存储
  storage:
    type: local
    path: /opt/metersphere/backup
  
  # 备份内容
  content:
    database: true
    files: true
    logs: false

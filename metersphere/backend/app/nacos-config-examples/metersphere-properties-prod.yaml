# Nacos配置示例：metersphere-properties-prod.yaml
# 生产环境配置文件，替代原来的 file:/opt/metersphere/conf/metersphere.properties

# 系统配置
metersphere:
  system:
    # 文件上传配置
    upload:
      max-size: 2048MB
      allowed-types: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,zip,rar
    
    # 临时文件配置
    temp:
      cleanup-interval: 1800
      max-age: 43200
    
    # 日志配置
    log:
      level: INFO
      retention: 90
    
    # 缓存配置
    cache:
      ttl: 7200
      max-size: 2000
    
    # 安全配置
    security:
      session-timeout: 86400
      max-login-attempts: 3
      lockout-duration: 600

# 数据库配置
database:
  # 连接池配置
  pool:
    initial-size: 10
    max-active: 200
    min-idle: 20
    max-wait: 30000
  
  # 性能配置
  performance:
    slow-query-threshold: 3000
    enable-slow-query-log: true
  
  # 读写分离配置
  read-write-split:
    enabled: true
    read-datasource-count: 2

# Redis配置
redis:
  # 连接池配置
  pool:
    max-active: 50
    max-idle: 20
    min-idle: 10
    max-wait: 5000
  
  # 序列化配置
  serialization:
    key-prefix: "ms:prod:"
    default-ttl: 7200
  
  # 集群配置
  cluster:
    enabled: true
    nodes: ${REDIS_CLUSTER_NODES}

# MinIO配置
minio:
  # 存储配置
  storage:
    default-bucket: metersphere-prod
    temp-bucket: metersphere-temp-prod
    backup-bucket: metersphere-backup-prod
  
  # 文件配置
  file:
    max-size: 2048MB
    allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,zip,rar
  
  # 备份配置
  backup:
    enabled: true
    schedule: "0 1 * * *"
    retention: 30

# Kafka配置
kafka:
  # 消费者配置
  consumer:
    max-poll-records: 1000
    max-poll-interval: 600000
    session-timeout: 60000
  
  # 生产者配置
  producer:
    batch-size: 32768
    linger-ms: 5
    buffer-memory: 67108864
  
  # 集群配置
  cluster:
    enabled: true
    bootstrap-servers: ${KAFKA_CLUSTER_SERVERS}

# JMeter配置
jmeter:
  # 执行配置
  execution:
    max-concurrent-users: 5000
    max-duration: 7200
    default-ramp-up: 120
  
  # 报告配置
  report:
    enable-html: true
    enable-csv: false
    enable-jtl: true
  
  # 资源配置
  resources:
    max-heap-size: 8g
    max-threads: 500
  
  # 分布式配置
  distributed:
    enabled: true
    controller-hosts: ${JMETER_CONTROLLER_HOSTS}

# 监控配置
monitoring:
  # 性能监控
  performance:
    enable-metrics: true
    enable-tracing: true
    sample-rate: 0.05
  
  # 健康检查
  health:
    check-interval: 15
    timeout: 5
    retry-count: 2
  
  # APM集成
  apm:
    enabled: true
    provider: skywalking
    endpoint: ${APM_ENDPOINT}

# 通知配置
notification:
  # 邮件配置
  email:
    enabled: true
    smtp-host: ${PROD_SMTP_HOST}
    smtp-port: 587
    smtp-username: ${PROD_EMAIL_USERNAME}
    smtp-password: ${PROD_EMAIL_PASSWORD}
  
  # 钉钉配置
  dingtalk:
    enabled: true
    webhook-url: ${PROD_DINGTALK_WEBHOOK_URL}
    secret: ${PROD_DINGTALK_SECRET}
  
  # 企业微信配置
  wechat:
    enabled: true
    corp-id: ${PROD_WECHAT_CORP_ID}
    agent-id: ${PROD_WECHAT_AGENT_ID}
    secret: ${PROD_WECHAT_SECRET}
  
  # 短信配置
  sms:
    enabled: true
    provider: aliyun
    access-key: ${SMS_ACCESS_KEY}
    secret-key: ${SMS_SECRET_KEY}
    sign-name: ${SMS_SIGN_NAME}

# 插件配置
plugins:
  # 插件管理
  management:
    auto-update: false
    update-check-interval: 604800
  
  # 插件安全
  security:
    signature-verification: true
    allow-unsigned: false
  
  # 插件白名单
  whitelist:
    enabled: true
    allowed-plugins:
      - metersphere-jmeter-functions
      - metersphere-jmeter-assertions

# 国际化配置
i18n:
  # 默认语言
  default-locale: zh_CN
  
  # 支持的语言
  supported-locales:
    - zh_CN
    - en_US
    - ja_JP
  
  # 消息缓存
  message-cache:
    enabled: true
    ttl: 7200

# 定时任务配置
scheduler:
  # 任务执行
  execution:
    max-concurrent-jobs: 20
    misfire-threshold: 30000
  
  # 任务存储
  storage:
    type: database
    table-prefix: ms_scheduler_
  
  # 任务监控
  monitoring:
    enabled: true
    alert-on-failure: true

# 文件存储配置
storage:
  # 本地存储
  local:
    enabled: false
    base-path: /opt/metersphere/storage
  
  # 云存储
  cloud:
    enabled: true
    provider: aliyun
    endpoint: ${PROD_CLOUD_STORAGE_ENDPOINT}
    access-key: ${PROD_CLOUD_STORAGE_ACCESS_KEY}
    secret-key: ${PROD_CLOUD_STORAGE_SECRET_KEY}
    bucket: ${PROD_CLOUD_STORAGE_BUCKET}
  
  # CDN配置
  cdn:
    enabled: true
    domain: ${CDN_DOMAIN}
    ssl-enabled: true

# 备份配置
backup:
  # 自动备份
  auto:
    enabled: true
    schedule: "0 1 * * *"
    retention: 90
  
  # 备份存储
  storage:
    type: cloud
    provider: aliyun
    bucket: ${BACKUP_BUCKET}
  
  # 备份内容
  content:
    database: true
    files: true
    logs: true
  
  # 备份加密
  encryption:
    enabled: true
    algorithm: AES-256

# 安全配置
security:
  # 访问控制
  access-control:
    enabled: true
    max-sessions-per-user: 5
    session-timeout: 86400
  
  # 密码策略
  password-policy:
    min-length: 8
    require-uppercase: true
    require-lowercase: true
    require-numbers: true
    require-special-chars: true
    max-age: 90
  
  # 登录限制
  login-restriction:
    max-failed-attempts: 3
    lockout-duration: 1800
    ip-whitelist: ${LOGIN_IP_WHITELIST}

# 性能优化配置
performance:
  # 缓存配置
  cache:
    redis:
      enabled: true
      ttl: 7200
    local:
      enabled: true
      ttl: 3600
  
  # 数据库优化
  database:
    connection-pool:
      max-size: 200
      min-size: 20
    query-cache:
      enabled: true
      size: 1000
  
  # 异步处理
  async:
    enabled: true
    core-pool-size: 20
    max-pool-size: 100
    queue-capacity: 1000

# 日志配置
logging:
  # 日志级别
  level:
    root: WARN
    io.metersphere: INFO
    org.springframework: WARN
    com.alibaba.nacos: WARN
  
  # 日志输出
  output:
    console: false
    file: true
    syslog: true
  
  # 日志轮转
  rotation:
    max-size: 500MB
    max-history: 90
    total-size-cap: 10GB

server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: metersphere
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:8.133.246.113}:${DB_PORT:3306}/${DB_NAME:metersphere}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:50}
      minimum-idle: ${DB_MIN_IDLE:10}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:8.133.246.113}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: ${REDIS_MAX_ACTIVE:20}
          max-wait: -1ms
          max-idle: ${REDIS_MAX_IDLE:10}
          min-idle: ${REDIS_MIN_IDLE:5}
  
  # MinIO 配置
  minio:
    endpoint: ${MINIO_ENDPOINT:http://8.133.246.113:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:metersphere}
  
  # Kafka 配置
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:8.133.246.113:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:metersphere-group}
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/*.xml

# 日志配置
logging:
  level:
    io.metersphere: ${LOG_LEVEL:INFO}
    org.springframework: ${SPRING_LOG_LEVEL:WARN}
    com.alibaba.nacos: ${NACOS_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ${LOG_PATH:logs}/metersphere.log
    max-size: ${LOG_MAX_SIZE:100MB}
    max-history: ${LOG_MAX_HISTORY:30}

# JMeter 配置
jmeter:
  home: ${JMETER_HOME:/opt/apache-jmeter}
  report:
    path: ${JMETER_REPORT_PATH:/opt/metersphere/reports}
    retention: ${JMETER_RETENTION:30}

# 系统配置
system:
  # 文件上传路径
  upload:
    path: ${UPLOAD_PATH:/opt/metersphere/upload}
    max-size: ${UPLOAD_MAX_SIZE:100MB}
  # 临时文件路径
  temp:
    path: ${TEMP_PATH:/opt/metersphere/temp}
  # 日志路径
  log:
    path: ${LOG_PATH:/opt/metersphere/logs}

# 性能调优配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

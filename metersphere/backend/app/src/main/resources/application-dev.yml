server:
  port: 8082

spring:
  application:
    name: metersphere
  
  # 数据源配置 - MySQL 8.0+ 兼容性
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://8.133.246.113:3306/metersphere?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true&defaultFetchSize=1000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
    username: ${DB_USERNAME:bgtech}
    password: ${DB_PASSWORD:Zly689258..}
    hikari:
      maximum-pool-size: 100
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
      auto-commit: false  # 禁用自动提交，让 JPA 事务管理器控制事务
    # 禁用内嵌数据库自动接管，防止落入 HSQLDB
    embedded-database-connection: none
  
  # 禁用 HSQLDB 自动配置，但保留 JPA 支持
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration
  
  # JPA/Hibernate 配置 - 为 whitebox-testing 模块提供支持
  jpa:
    hibernate:
      ddl-auto: validate  # 不自动创建表，由 Flyway 管理
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        connection:
          provider_disables_autocommit: false  # 让连接池控制 autocommit
        cache:
          use_second_level_cache: false
          use_query_cache: false
    # 确保 JPA 使用与主数据源相同的配置
    database-platform: org.hibernate.dialect.MySQL8Dialect

  # Flyway配置 - MySQL 8.0+ 兼容性
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:migration
    table: metersphere_version
    baseline-version: 0
    encoding: UTF-8
    validate-on-migrate: false
    url: jdbc:mysql://8.133.246.113:3306/metersphere?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true&defaultFetchSize=1000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
    user: ${DB_USERNAME:bgtech}
    password: ${DB_PASSWORD:Zly689258..}
    init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
  
  # Spring AI配置 - 解决AI模块数据库连接问题
  ai:
    chat:
      memory:
        repository:
          jdbc:
            url: jdbc:mysql://8.133.246.113:3306/metersphere?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true&defaultFetchSize=1000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
            username: ${DB_USERNAME:bgtech}
            password: ${DB_PASSWORD:Zly689258..}
            driver-class-name: com.mysql.cj.jdbc.Driver
            initialize-schema: never  # 不自动创建表，使用已创建的表
  
  # Quartz配置 - 直接配置 MySQL 数据源
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never  # 不自动创建表，使用已创建的表
      platform: mysql
    properties:
      org.quartz.jobStore.class: org.quartz.impl.jdbcjobstore.JobStoreTX
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: false
      org.quartz.jobStore.useProperties: false
      org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
      org.quartz.threadPool.threadCount: 10
      org.quartz.threadPool.threadPriority: 5
      org.quartz.threadPool.threadsInheritContextClassLoaderOfInitializingThread: true
      org.quartz.scheduler.instanceName: msScheduler
      org.quartz.scheduler.instanceId: AUTO
      # 直接配置 MySQL 数据源
      org.quartz.jobStore.dataSource: quartz
      org.quartz.dataSource.quartz.driver: com.mysql.cj.jdbc.Driver
      org.quartz.dataSource.quartz.URL: jdbc:mysql://8.133.246.113:3306/metersphere?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true&defaultFetchSize=1000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      org.quartz.dataSource.quartz.user: bgtech
      org.quartz.dataSource.quartz.password: Zly689258..
      org.quartz.dataSource.quartz.maxConnections: 10
      org.quartz.dataSource.quartz.validationQuery: SELECT 1
  
  # Redis 配置
  data:
    redis:
      host: 8.133.246.113
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  
  # MinIO 配置
  minio:
    endpoint: http://8.133.246.113:9000
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: metersphere
  
  # Kafka 配置
  kafka:
    bootstrap-servers: 8.133.246.113:9092
    consumer:
      group-id: metersphere-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/*.xml

# 日志配置
logging:
  level:
    io.metersphere: DEBUG
    org.springframework: INFO
    com.alibaba.nacos: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/metersphere.log
    max-size: 100MB
    max-history: 30

# JMeter 配置
jmeter:
  home: /opt/apache-jmeter
  report:
    path: /opt/metersphere/reports
    retention: 30

# 系统配置
system:
  # 文件上传路径
  upload:
    path: /opt/metersphere/upload
    max-size: 100MB
  # 临时文件路径
  temp:
    path: /opt/metersphere/temp
  # 日志路径
  log:
    path: /opt/metersphere/logs

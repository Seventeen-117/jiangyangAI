# Dubbo 服务治理配置示例
# 各服务应在自己的 application.yml 或 application-{profile}.yml 中配置以下参数

# ================================
# Dubbo 服务治理通用配置
# ================================

dubbo:
  # 应用配置
  application:
    version: ${DUBBO_APPLICATION_VERSION:1.0.0}
    
  # 服务治理开关
  governance:
    enabled: ${DUBBO_GOVERNANCE_ENABLED:true}
  
  # 提供者配置
  provider:
    # 增强配置开关
    enhanced:
      enabled: ${DUBBO_PROVIDER_ENHANCED_ENABLED:true}
    # 线程池配置
    threads: ${DUBBO_PROVIDER_THREADS:200}
    accepts: ${DUBBO_PROVIDER_ACCEPTS:1000}
    # 超时和重试配置
    timeout: ${DUBBO_PROVIDER_TIMEOUT:5000}
    retries: ${DUBBO_PROVIDER_RETRIES:0}
    # 服务降级配置
    stub: ${DUBBO_PROVIDER_STUB:true}
  
  # 元数据报告配置
  metadata-report:
    enabled: ${DUBBO_METADATA_REPORT_ENABLED:true}
    address: ${DUBBO_METADATA_REPORT_ADDRESS:nacos://${NACOS_HOST:8.133.246.113}:${NACOS_PORT:8848}}
    group: ${DUBBO_METADATA_REPORT_GROUP:${NACOS_GROUP:DEFAULT_GROUP}}
    retry-times: ${DUBBO_METADATA_RETRY_TIMES:3}
    retry-period: ${DUBBO_METADATA_RETRY_PERIOD:5000}
    cycle-report: ${DUBBO_METADATA_CYCLE_REPORT:false}
  
  # 监控指标配置
  metrics:
    enabled: ${DUBBO_METRICS_ENABLED:false}  # 默认关闭，按需开启
    protocol: ${DUBBO_METRICS_PROTOCOL:prometheus}
    port: ${DUBBO_METRICS_PORT:28080}
    enable-jvm: ${DUBBO_METRICS_ENABLE_JVM:true}

# ================================
# 各服务差异化配置建议
# ================================


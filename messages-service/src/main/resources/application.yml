# Messages Service 主配置文件
server:
  port: 8687
  # Tomcat 优化配置
  tomcat:
    # 线程池配置
    threads:
      max: 200                    # 最大线程数
      min-spare: 10              # 最小空闲线程数
    # 连接器配置
    max-connections: 8192        # 最大连接数
    accept-count: 100            # 等待队列长度
    max-http-header-size: 8KB    # 最大HTTP头大小
    max-http-form-post-size: 2MB # 最大POST大小
    max-http-header-count: 200   # 最大HTTP头数量
    # 连接超时配置
    connection-timeout: 20000    # 连接超时 20秒
    keep-alive-timeout: 15000    # Keep-Alive超时 15秒
    max-keep-alive-requests: 100 # 最大Keep-Alive请求数
    # 压缩配置
    compression:
      enabled: true
      mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
      min-response-size: 1024
    # 启用HTTP/2
    http2:
      enabled: true
  # 服务端配置
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        max-age: 1800
        http-only: true
        secure: false
        same-site: lax
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: messages-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 主配置
  main:
    web-application-type: servlet
    banner-mode: off
    lazy-initialization: false
    allow-circular-references: true
    allow-bean-definition-overriding: true
  # Jackson 优化
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      write-null-map-values: false
      write-empty-json-arrays: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
      fail-on-null-for-primitives: false
    mapper:
      default-view-inclusion: false
    time-zone: GMT+8
  # 缓存配置
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=300s,expireAfterAccess=60s,refreshAfterWrite=60s
    cache-names:
      - user-cache
      - config-cache
      - session-cache
      - api-cache
      - static-cache
  # 任务调度优化
  task:
    execution:
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: async-task-
    scheduling:
      pool:
        size: 8
      thread-name-prefix: scheduled-task-
  # 消息转换器优化
  # 静态资源优化
  web:
    resources:
      cache:
        period: 31536000  # 1年
        cachecontrol:
          max-age: 31536000
          public: true
      chain:
        strategy:
          fixed:
            enabled: true
            version: "1.0"
          content:
            enabled: true
        cache: true
        html-application-cache: true
  # 数据库连接池优化
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # 连接池基本配置
      minimum-idle: 5                    # 最小空闲连接数
      maximum-pool-size: 20              # 最大连接池大小
      idle-timeout: 300000               # 空闲连接超时时间 (5分钟)
      max-lifetime: 1200000              # 连接最大生存时间 (20分钟)
      connection-timeout: 20000          # 连接超时时间 (20秒)
      validation-timeout: 3000           # 验证超时时间 (3秒)
      # 性能优化配置
      leak-detection-threshold: 60000    # 连接泄漏检测阈值 (1分钟)
      connection-test-query: SELECT 1    # 连接测试查询
      auto-commit: true                  # 自动提交
      read-only: false                   # 只读模式
      # 连接池名称
      pool-name: HikariCP-Pool
      # 数据源属性
      data-source-properties:
        # MySQL 优化
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
        useLocalTransactionState: true
        # 连接优化
        socketTimeout: 30000
        connectTimeout: 10000
        autoReconnect: true
        failOverReadOnly: false
        maxReconnects: 3
        initialTimeout: 2
        # 字符集优化
        characterEncoding: utf8mb4
        useUnicode: true
        # 其他优化
        useSSL: false
        allowPublicKeyRetrieval: true
        serverTimezone: GMT%2B8
        zeroDateTimeBehavior: convertToNull
        nullCatalogMeansCurrent: true
        nullNamePatternMatchesAll: true
        useInformationSchema: true

# Dubbo配置
dubbo:
  application:
    name: ${spring.application.name}
    version: 1.0.0
    logger: slf4j
  registry:
    address: nacos://${NACOS_HOST:8.133.246.113}:${NACOS_PORT:8848}
    group: ${NACOS_GROUP:DEFAULT_GROUP}
    namespace: ${NACOS_NAMESPACE:d750d92e-152f-4055-a641-3bc9dda85a29}
    timeout: 10000
    check: false
  protocol:
    name: dubbo
    port: 20882
    serialization: hessian2
    threads: 200
    accepts: 1000
    heartbeat: 60000
  provider:
    timeout: 5000   # 消息服务中等超时时间
    retries: 0
    threads: 200    # 消息服务标准线程配置
    accepts: 1000
    group: messages-service
  scan:
    base-packages: com.jiangyang.messages
  # 服务治理配置
  governance:
    enabled: true
  metadata-report:
    enabled: ${DUBBO_METADATA_REPORT_ENABLED:true}
    retry-times: 3
    retry-period: 5000
  metrics:
    enabled: ${DUBBO_METRICS_ENABLED:false}
    protocol: prometheus
    port: 28083  # messages-service专用监控端口
    enable-jvm: true

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    metrics:
      enabled: true
  health:
    redis:
      enabled: false
    db:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s
  prometheus:
    metrics:
      export:
        enabled: true

# 日志配置
logging:
  level:
    root: INFO
    org.springframework: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.apache.tomcat: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.juli: WARN
    com.zaxxer.hikari: WARN
    com.alibaba.druid: WARN
    # 应用日志
    com.jiangyang: DEBUG
    org.apache.dubbo: INFO
    com.jiangyang.dubbo: DEBUG
    com.jiangyang.messages: DEBUG
    com.jiangyang.messages.dubbo: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 1GB
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
    lazy-initialization: false
  autoconfigure:
    exclude: []
  config:
    import:
      - optional:classpath:application-message-service.yml

# 性能监控配置
micrometer:
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s

# 应用特定优化
application:
  performance:
    # 启用性能优化
    enabled: true
    # 响应时间目标
    target-response-time: 10ms
    # 缓存配置
    cache:
      enabled: true
      ttl: 300s
      max-size: 10000
    # 异步处理
    async:
      enabled: true
      core-pool-size: 8
      max-pool-size: 16
      queue-capacity: 100
    # 连接池优化
    connection-pool:
      max-active: 20
      min-idle: 5
      max-wait: 1000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

# 服务配置
service:
  name: messages-service
  version: 1.0.0


# 系统测试和错误处理API测试数据
description: "系统测试和错误处理API测试用例"
baseUrl: "/actuator"
testCases:
  - id: "system-health-check"
    description: "系统健康检查"
    endpoint: "/health"
    request:
      method: "GET"
    expectedResponse:
      statusCode: 200
      bodyContains:
        - "status"
      bodyMatches:
        status: "UP"
        
  - id: "system-info-check"
    description: "系统信息查询"
    endpoint: "/info"
    request:
      method: "GET"
    expectedResponse:
      statusCode: 200
      
